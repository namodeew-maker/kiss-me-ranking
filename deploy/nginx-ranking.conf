# Nginx reverse proxy for Kiss Me Ranking
# Location: /etc/nginx/sites-available/ranking.kissme-vip.com

upstream kiss_me_ranking_upstream {
    server 127.0.0.1:3010;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/kiss-me-ranking
    levels=1:2
    keys_zone=kiss_me_ranking_cache:20m
    max_size=256m
    inactive=30m
    use_temp_path=off;

map $http_authorization $skip_app_cache {
    default 1;
    "" 0;
}

log_format ranking_timing
    '$remote_addr - $host [$time_local] '
    '"$request" $status $body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time '
    'uaddr=$upstream_addr cache=$upstream_cache_status';

server {
    listen 80;
    server_name ranking.kissme-vip.com;
    access_log /var/log/nginx/ranking.kissme-vip.com.access.log ranking_timing;

    # Avoid Cloudflare flexible/proxied HTTPS redirect loops.
    set $redirect_to_https 1;
    if ($http_x_forwarded_proto = "https") {
        set $redirect_to_https 0;
    }
    if ($redirect_to_https = 1) {
        return 301 https://$host$request_uri;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    location / {
        proxy_pass http://kiss_me_ranking_upstream;
    }
}

server {
    listen 443 ssl http2;
    server_name ranking.kissme-vip.com;
    access_log /var/log/nginx/ranking.kissme-vip.com.access.log ranking_timing;

    ssl_certificate /etc/letsencrypt/live/ranking.kissme-vip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ranking.kissme-vip.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 6M;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering on;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;

    location / {
        proxy_pass http://kiss_me_ranking_upstream;
    }

    location = /api/staffs {
        proxy_pass http://kiss_me_ranking_upstream;
        proxy_cache kiss_me_ranking_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_bypass $skip_app_cache;
        proxy_no_cache $skip_app_cache;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location = /api/round {
        proxy_pass http://kiss_me_ranking_upstream;
        proxy_cache kiss_me_ranking_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_bypass $skip_app_cache;
        proxy_no_cache $skip_app_cache;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location = /api/sold-out {
        proxy_pass http://kiss_me_ranking_upstream;
        proxy_cache kiss_me_ranking_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_bypass $skip_app_cache;
        proxy_no_cache $skip_app_cache;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location ^~ /api/ranking/ {
        proxy_pass http://kiss_me_ranking_upstream;
        proxy_cache kiss_me_ranking_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_bypass $skip_app_cache;
        proxy_no_cache $skip_app_cache;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|woff2?|ttf)$ {
        proxy_pass http://kiss_me_ranking_upstream;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
