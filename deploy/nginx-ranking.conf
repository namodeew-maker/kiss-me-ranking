# Nginx reverse proxy for Kiss Me Ranking
# Location: /etc/nginx/sites-available/ranking.kissme-vip.com

server {
    listen 80;
    server_name ranking.kissme-vip.com;

    # Cloudflare only — restrict to CF IP ranges (optional but recommended)
    # Uncomment below to only accept traffic from Cloudflare:
    # include /etc/nginx/cloudflare-ips.conf;

    # Security headers (extra layer on top of helmet)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Max upload size (match multer 5MB limit)
    client_max_body_size 6M;

    # Proxy to Node.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|woff2?|ttf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
