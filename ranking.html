<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
    <meta name="theme-color" content="#060612">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kiss Me">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/Logo%20Ranking/Diamon.png">
    <title>Kiss Me Ranking — อันดับ</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260504c">
    <link rel="stylesheet" href="ranking.css?v=20260504">
</head>
<body class="futuristic-bg">

    <div class="bg-particles" id="particles"></div>

    <div class="container ranking-page">
        <header>
            <div class="logo-area">
                <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>
                <div class="logo-icon">🏆</div>
                <div>
                    <h1>Kiss Me Ranking</h1>
                    <p class="subtitle">Customer & Staff Leaderboard Hall</p>
                </div>
            </div>
        </header>

        <!-- Tabs -->
        <nav class="ranking-tabs" id="ranking-tabs">
            <button class="rank-tab-btn active" data-tab="customer">🏆 อันดับลูกค้า Kiss Me Ranking</button>
            <button class="rank-tab-btn" data-tab="staff-usage">💌 อันดับยอดแจ้งใช้บริการน้องๆ</button>
        </nav>

        <!-- รอบกิจกรรม -->
        <div class="ranking-round-select" id="ranking-round-select" hidden>
            <label for="round-select">เลือกรอบกิจกรรม:</label>
            <div class="ranking-round-select-wrap">
                <select id="round-select" class="ranking-round-dropdown">
                    <!-- ตัวเลือกจะถูกเติมโดย JS -->
                </select>
            </div>
        </div>

        <!-- อันดับลูกค้า -->
        <section class="rank-tab-content" id="tab-customer">
            <div class="leaderboard-shell" id="customer-ranking-list">
                <div class="ranking-loading">กำลังโหลดอันดับ...</div>
            </div>
        </section>

        <!-- อันดับยอดแจ้งใช้บริการน้องๆ -->
        <section class="rank-tab-content rank-tab-hidden" id="tab-staff-usage">
            <div class="leaderboard-shell" id="staff-usage-ranking-list">
                <div class="ranking-loading">กำลังโหลดอันดับ...</div>
            </div>
        </section>
    </div>

    <div class="img-modal-overlay" id="ranking-img-modal" hidden>
        <div class="img-modal-content">
            <button class="img-modal-close" id="ranking-img-modal-close">&times;</button>
            <img id="ranking-img-modal-img" src="" alt="รูปโปรไฟล์">
        </div>
    </div>

    <!-- Bottom Tab Bar (mobile-first navigation) -->
    <nav class="app-bottom-nav" aria-label="เมนูหลัก">
        <a href="index.html" class="app-bottom-nav-item">
            <span class="app-bottom-nav-icon">🏠</span>
            <span class="app-bottom-nav-label">หน้าหลัก</span>
        </a>
        <a href="ranking.html" class="app-bottom-nav-item active" aria-current="page">
            <span class="app-bottom-nav-icon">🏆</span>
            <span class="app-bottom-nav-label">อันดับ</span>
        </a>
        <a href="profile.html" class="app-bottom-nav-item">
            <span class="app-bottom-nav-icon">👤</span>
            <span class="app-bottom-nav-label">โปรไฟล์</span>
        </a>
        <button type="button" class="app-bottom-nav-item app-bottom-nav-logout" id="btn-logout" aria-label="ออกจากระบบ">
            <span class="app-bottom-nav-icon">🚪</span>
            <span class="app-bottom-nav-label">ออกจาก</span>
        </button>
    </nav>

    <script src="ranking.js?v=20260504b"></script>
</body>
</html>
